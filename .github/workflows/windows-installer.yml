name: Nexus Assistent Windows Installer

# Baut den Windows-Installer. Sind die Update-Schlüssel eingerichtet (siehe UPDATES.md), wird das Paket signiert
# und als Release im öffentlichen Repository veröffentlicht; NEXUS findet es dann über „Nach Updates suchen“.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build MSI and EXE installer
    runs-on: windows-latest
    env:
      HAS_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
      RELEASE_REPO: ${{ format('{0}/{1}', github.repository_owner, vars.RELEASE_REPO_NAME || 'nexus-assistent-releases') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Run UI and unit tests
        run: npm test

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check update setup
        shell: pwsh
        env:
          S1: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          S2: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          S3: ${{ secrets.RELEASES_TOKEN != '' }}
          V1: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
        run: |
          # Zeigt nur, OB etwas eingetragen ist - nie den Inhalt.
          function Show($name, $kind, $ok) { if ($ok -eq 'true') { Write-Host "OK      $kind $name" } else { Write-Host "FEHLT   $kind $name" } }
          Show 'TAURI_SIGNING_PRIVATE_KEY' 'Secret  ' $env:S1
          Show 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD' 'Secret  ' $env:S2
          Show 'RELEASES_TOKEN' 'Secret  ' $env:S3
          Show 'TAURI_UPDATER_PUBKEY' 'Variable' $env:V1

      - name: Configure signed updates
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
          $updater = [ordered]@{ pubkey = $env:PUBKEY.Trim(); endpoints = @("https://github.com/$env:RELEASE_REPO/releases/latest/download/latest.json"); windows = @{ installMode = 'passive' } }
          $conf | Add-Member -NotePropertyName plugins -NotePropertyValue ([ordered]@{ updater = $updater }) -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          Write-Host "Updates werden signiert und unter $env:RELEASE_REPO veroeffentlicht."

      - name: Create release tag in release repository
        if: env.HAS_SIGNING == 'true' && env.HAS_RELEASE_TOKEN == 'true'
        shell: pwsh
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Der Tag wird vorab per Git angelegt; dann muss die Release-API keinen Commit aus dem privaten Repo kennen.
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $token = $env:TOKEN.Trim()   # eingefügte Secrets enthalten oft einen Zeilenumbruch am Ende
          git clone --depth 1 "https://x-access-token:$token@github.com/$($env:RELEASE_REPO).git" "$env:RUNNER_TEMP/release-repo"
          if ($LASTEXITCODE -ne 0) { throw 'Release-Repository nicht erreichbar: RELEASES_TOKEN braucht Zugriff auf dieses Repository.' }
          Set-Location "$env:RUNNER_TEMP/release-repo"
          if (git ls-remote --tags origin "refs/tags/v$v") { Write-Host "Tag v$v existiert bereits."; exit 0 }
          git tag "v$v"
          git push origin "v$v"
          if ($LASTEXITCODE -ne 0) { throw 'Tag konnte nicht angelegt werden: RELEASES_TOKEN braucht Contents: Read and write.' }

      - name: Build signed installers
        if: env.HAS_SIGNING == 'true' && env.HAS_RELEASE_TOKEN == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Publish release with latest.json
        if: env.HAS_SIGNING == 'true' && env.HAS_RELEASE_TOKEN == 'true'
        shell: pwsh
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Veroeffentlicht Installer, Signatur und latest.json im oeffentlichen Release-Repository (Tag existiert bereits).
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $headers = @{ Authorization = "Bearer $($env:TOKEN.Trim())"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$($env:RELEASE_REPO)"
          $exe = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if (-not $exe -or -not (Test-Path "$($exe.FullName).sig")) { throw 'Installer oder Signatur (.sig) fehlt.' }
          $exeName = "Nexus-Assistent_${v}_x64-setup.exe"
          $msiName = "Nexus-Assistent_${v}_x64_de.msi"
          $latest = [ordered]@{
            version = $v
            notes = "Nexus Assistent $v - Aenderungen siehe CHANGELOG."
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{ 'windows-x86_64' = [ordered]@{
              signature = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
              url = "https://github.com/$($env:RELEASE_REPO)/releases/download/$tag/$exeName" } }
          }
          $latestPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          $latest | ConvertTo-Json -Depth 5 | Set-Content $latestPath -Encoding utf8NoBOM
          try { $release = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$tag" }
          catch {
            $body = @{ tag_name = $tag; name = "Nexus Assistent $v"; body = 'Neue Version des Nexus Assistenten. Installation in NEXUS unter KI-Verwaltung -> Updates.'; draft = $false; prerelease = $false } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Headers $headers -Uri "$api/releases" -Body $body -ContentType 'application/json'
          }
          $files = @(@{ path = $exe.FullName; name = $exeName }, @{ path = $latestPath; name = 'latest.json' })
          if ($msi) { $files += @{ path = $msi.FullName; name = $msiName } }
          foreach ($f in $files) {
            $old = $release.assets | Where-Object { $_.name -eq $f.name }
            if ($old) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "$api/releases/assets/$($old.id)" | Out-Null }
            $uri = "https://uploads.github.com/repos/$($env:RELEASE_REPO)/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($f.name))"
            Invoke-RestMethod -Method Post -Headers $headers -Uri $uri -InFile $f.path -ContentType 'application/octet-stream' | Out-Null
            Write-Host "Hochgeladen: $($f.name)"
          }
          Write-Host "Release: $($release.html_url)"

      - name: Build installers (without publishing)
        if: env.HAS_SIGNING != 'true' || env.HAS_RELEASE_TOKEN != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Assistent-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
